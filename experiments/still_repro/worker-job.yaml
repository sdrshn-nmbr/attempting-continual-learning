apiVersion: batch/v1
kind: Job
metadata:
  name: still-repro-worker
  labels:
    app: still-repro
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: still-repro
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0@sha256:04b7c83e7fec4ea0e6d38fd77025aa39b5f7d0a61ecd49a977f1a520616fdbab
          command: [sleep, "43200"]
          env:
            - name: HF_HOME
              value: /mnt/shared/still-repro/huggingface
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OMP_NUM_THREADS
              value: "8"
          resources:
            requests:
              cpu: "64"
              memory: 256Gi
            limits:
              amd.com/gpu: 8
              memory: 768Gi
          volumeMounts:
            - name: shared
              mountPath: /mnt/shared
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared
          hostPath:
            path: /mnt/shared
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
