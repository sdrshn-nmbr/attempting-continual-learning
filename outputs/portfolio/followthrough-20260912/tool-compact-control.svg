  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #415465" x="18.9" y="36.6912" transform="rotate(-0 18.9 36.6912)">Expert adapters → Agent-Dice merge → rank-8 compression → 128 workflow updates</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.9" y="301.644" transform="rotate(-0 18.9 301.644)">All three start from identical compact factors: 3,670,016 adapter bytes; no dense offset. One calendar stream.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.9" y="317.1672" transform="rotate(-0 18.9 317.1672)">Control and replay use the same current rows and current-loss coefficient. Batch size and optimizer interactions differ.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="18.9" y="332.6904" transform="rotate(-0 18.9 332.6904)">Fixed final checkpoints; whole JSON answers, execution result and native EOS independently checked after reloading.</text>
