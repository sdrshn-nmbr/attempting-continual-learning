apiVersion: batch/v1
kind: Job
metadata:
  generateName: cl-portfolio-
  labels:
    app: cl-portfolio
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: cl-portfolio
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: uv
          image: ghcr.io/astral-sh/uv:0.12.10-python3.12-trixie-slim@sha256:4bf11151c225e2a4d60e2a576b67d925660055199389d9a64fbdc02b6f3d43d5
          command: [sh, -c, 'cp "$(command -v uv)" /tools/uv']
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: portfolio
          image: rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0@sha256:4449f856653602317e4101a76fce599c7fcd58ccec2e539951fce5f73083179e
          command: [bash, -c]
          args:
            - |
              set -Eeuo pipefail
              export PATH="/tools:$PATH"
              exec uv run --no-project --python "$(command -v python)" python \
                /bootstrap/supervisor.py --root /mnt/shared/cl-portfolio --gpus 8
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /mnt/shared/cl-portfolio/huggingface
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: UV_CACHE_DIR
              value: /mnt/shared/cl-smoke/uv-cache
            - name: OMP_NUM_THREADS
              value: "4"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: HF_DEACTIVATE_ASYNC_LOAD
              value: "1"
          resources:
            requests:
              cpu: "64"
              memory: 256Gi
            limits:
              amd.com/gpu: 8
              memory: 768Gi
          volumeMounts:
            - name: shared
              mountPath: /mnt/shared
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared
          hostPath:
            path: /mnt/shared
            type: Directory
        - name: bootstrap
          configMap:
            name: cl-portfolio-runtime-2b9aa79c0138
        - name: tools
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
