apiVersion: v1
kind: Pod
metadata:
  name: cl-portfolio-control
  labels:
    app: cl-portfolio
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    node-role.kubernetes.io/cpu: ""
  containers:
    - name: control
      image: ghcr.io/astral-sh/uv:0.12.10-python3.12-trixie-slim@sha256:4bf11151c225e2a4d60e2a576b67d925660055199389d9a64fbdc02b6f3d43d5
      command: [sleep, "172800"]
      resources:
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "8"
          memory: 16Gi
      env:
        - name: HF_HOME
          value: /mnt/shared/cl-portfolio/huggingface
        - name: UV_CACHE_DIR
          value: /mnt/shared/cl-smoke/uv-cache
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
      volumeMounts:
        - name: shared
          mountPath: /mnt/shared
  volumes:
    - name: shared
      hostPath:
        path: /mnt/shared
        type: Directory
