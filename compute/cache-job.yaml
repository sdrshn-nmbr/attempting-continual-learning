apiVersion: batch/v1
kind: Job
metadata:
  generateName: cl-model-cache-
  labels:
    app: cl-compute-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: cl-compute-smoke
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/cpu: ""
      containers:
        - name: download
          image: ghcr.io/astral-sh/uv:0.12.10-python3.12-trixie-slim@sha256:4bf11151c225e2a4d60e2a576b67d925660055199389d9a64fbdc02b6f3d43d5
          command: [bash, -c]
          args:
            - |
              set -Eeuo pipefail
              mkdir -p /mnt/shared/cl-smoke
              uv venv /tmp/hf-env
              uv pip install --python /tmp/hf-env/bin/python huggingface-hub==1.30.0
              export VIRTUAL_ENV=/tmp/hf-env
              export PATH="/tmp/hf-env/bin:$PATH"
              uv run --no-project python /code/download.py 2>&1 | tee /mnt/shared/cl-smoke/download.log
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: UV_CACHE_DIR
              value: /mnt/shared/cl-smoke/uv-cache
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: shared
              mountPath: /mnt/shared
            - name: code
              mountPath: /code
              readOnly: true
      volumes:
        - name: shared
          hostPath:
            path: /mnt/shared
            type: Directory
        - name: code
          configMap:
            name: cl-compute-smoke
