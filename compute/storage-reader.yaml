apiVersion: v1
kind: Pod
metadata:
  name: cl-storage-reader
  labels:
    app: cl-compute-smoke
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    node-role.kubernetes.io/cpu: ""
  containers:
    - name: reader
      image: ghcr.io/astral-sh/uv:0.12.10-python3.12-trixie-slim@sha256:4bf11151c225e2a4d60e2a576b67d925660055199389d9a64fbdc02b6f3d43d5
      command: [sleep, "7200"]
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "4"
          memory: 2Gi
      volumeMounts:
        - name: shared
          mountPath: /mnt/shared
          readOnly: true
  volumes:
    - name: shared
      hostPath:
        path: /mnt/shared
        type: Directory
